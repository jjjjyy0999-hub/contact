<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>검단 더샵 레이크파크 | 총 2,857세대 대단지 분양 안내</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <script>
    function nextHeroImg(img) {
      var list = ['hero.jpg', 'hero.png', 'images/hero.jpg', 'images/17250.jpg', '17250.JPG', '17250.png'];
      var step = parseInt(img.getAttribute('data-step') || '0', 10);
      if (step < list.length) {
        img.setAttribute('data-step', String(step + 1));
        img.src = list[step];
      } else {
        img.style.display = 'none';
        var fb = document.getElementById('heroFallback');
        if (fb) fb.style.display = 'flex';
      }
    }
  </script>
  <style>
    :root {
      --navy: #0c1b33;
      --navy-deep: #071121;
      --navy-soft: #162b4d;
      --gold: #b8924f;
      --gold-light: #d9ba7c;
      --ivory: #f6f4ef;
      --surface: #ffffff;
      --text: #1c222b;
      --text-sub: #596475;
      --line: #e4e1d9;
      --line-dark: rgba(255, 255, 255, 0.14);
      --serif: "Noto Serif KR", Georgia, serif;
      --sans: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--sans);
      color: var(--text);
      background: var(--surface);
      line-height: 1.65;
      word-break: keep-all;
      overflow-x: hidden;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ================= HEADER ================= */
    .site-header {
      position: sticky;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(9, 20, 38, 0.97);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(217, 186, 124, 0.24);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
    }

    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      height: 74px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
      color: #fff;
    }

    .logo-en {
      font-size: 10.5px;
      letter-spacing: 2.6px;
      color: var(--gold-light);
      font-weight: 600;
    }

    .logo-kr {
      font-family: var(--serif);
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.4px;
      margin-top: 3px;
    }

    .gnb {
      display: flex;
      align-items: center;
      gap: 32px;
      list-style: none;
    }

    .gnb a {
      color: rgba(255, 255, 255, 0.88);
      font-size: 15px;
      font-weight: 500;
      position: relative;
      padding: 6px 0;
      transition: color 0.2s;
    }

    .gnb a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 1.5px;
      background: var(--gold-light);
      transition: width 0.25s ease;
    }

    .gnb a:hover {
      color: var(--gold-light);
    }

    .gnb a:hover::after {
      width: 100%;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .tel-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.4px;
    }

    .tel-link span {
      color: var(--gold-light);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0;
    }

    .header-btn {
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: var(--navy-deep);
      font-size: 13.5px;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 4px;
      transition: transform 0.2s, filter 0.2s;
    }

    .header-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
    }

    .mobile-menu-btn {
      display: none;
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 4px;
      font-size: 20px;
      cursor: pointer;
    }

    /* Mobile Drawer */
    .mobile-drawer {
      position: fixed;
      inset: 0;
      z-index: 1200;
      background: rgba(7, 17, 33, 0.98);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .mobile-drawer.open {
      opacity: 1;
      pointer-events: auto;
    }

    .mobile-drawer a {
      color: #fff;
      font-family: var(--serif);
      font-size: 24px;
      font-weight: 500;
    }

    .mobile-drawer .close-drawer {
      position: absolute;
      top: 20px;
      right: 24px;
      background: none;
      border: none;
      color: var(--gold-light);
      font-size: 32px;
      cursor: pointer;
    }

    /* ================= HERO (조감도 중심 쇼케이스) ================= */
    .hero {
      background:
        radial-gradient(circle at 80% 10%, rgba(184, 146, 79, 0.14) 0%, transparent 45%),
        linear-gradient(180deg, #071121 0%, #0c1b33 65%, #071121 100%);
      color: #fff;
      padding: 28px 20px 64px;
    }

    .hero-wrap {
      max-width: 1240px;
      margin: 0 auto;
    }

    .hero-visual-stage {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(217, 186, 124, 0.35);
      box-shadow: 0 28px 64px rgba(0, 0, 0, 0.45);
      background: #0a172b;
    }

    .hero-visual-stage img {
      width: 100%;
      height: auto;
      display: block;
    }

    .hero-fallback {
      display: none;
      min-height: 360px;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 24px;
      background: linear-gradient(145deg, #0b1b33 0%, #1a3863 100%);
    }

    .hero-fallback small {
      color: var(--gold-light);
      letter-spacing: 2.5px;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .hero-fallback strong {
      font-family: var(--serif);
      font-size: 26px;
      margin-bottom: 8px;
    }

    .hero-fallback p {
      color: rgba(255, 255, 255, 0.72);
      font-size: 14px;
    }

    .hero-panel {
      margin-top: 28px;
      text-align: center;
    }

    .hero-kicker {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 12.5px;
      letter-spacing: 2.8px;
      color: var(--gold-light);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .hero-kicker::before,
    .hero-kicker::after {
      content: "";
      width: 24px;
      height: 1px;
      background: rgba(217, 186, 124, 0.65);
    }

    .hero-panel h1 {
      font-family: var(--serif);
      font-size: clamp(24px, 3.6vw, 40px);
      font-weight: 700;
      line-height: 1.32;
      letter-spacing: -0.7px;
      margin-bottom: 12px;
    }

    .hero-panel h1 span {
      color: var(--gold-light);
    }

    .hero-sub {
      font-size: clamp(14px, 1.8vw, 16.5px);
      color: rgba(255, 255, 255, 0.8);
      max-width: 680px;
      margin: 0 auto 28px;
      font-weight: 300;
    }

    .hero-btns {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 36px;
    }

    .btn-gold {
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: var(--navy-deep);
      font-weight: 700;
      font-size: 15.5px;
      padding: 15px 32px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 12px 28px rgba(184, 146, 79, 0.28);
    }

    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 32px rgba(184, 146, 79, 0.36);
    }

    .btn-outline-light {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.34);
      color: #fff;
      font-weight: 500;
      font-size: 15.5px;
      padding: 15px 28px;
      border-radius: 4px;
      transition: background 0.2s, border-color 0.2s;
    }

    .btn-outline-light:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: var(--gold-light);
    }

    .hero-metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid rgba(255, 255, 255, 0.16);
      border-bottom: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.04);
    }

    .metric-item {
      padding: 20px 12px;
      position: relative;
    }
