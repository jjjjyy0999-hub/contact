<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>문의 신청</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
      background-color: #f4f6f9;
      color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      padding: 36px 30px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #111;
    }

    .desc {
      font-size: 14px;
      color: #666;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
    }

    .required {
      color: #e53935;
      margin-left: 2px;
    }

    input[type="text"],
    input[type="tel"],
    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d8dde6;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    textarea {
      min-height: 130px;
      resize: vertical;
      line-height: 1.5;
    }

    button[type="submit"] {
      width: 100%;
      padding: 14px;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 4px;
    }

    button[type="submit"]:hover {
      background-color: #1d4ed8;
    }

    button[type="submit"]:disabled {
      background-color: #93c5fd;
      cursor: not-allowed;
    }

    .status-msg {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
      display: none;
    }

    .status-msg.success {
      display: block;
      background-color: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }

    .status-msg.error {
      display: block;
      background-color: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>문의하기</h1>
    <p class="desc">아래 내용을 남겨주시면 확인 후 빠르게 연락드리겠습니다.</p>

    <form id="contactForm">
      <div class="form-group">
        <label for="name">이름 <span class="required">*</span></label>
        <input type="text" id="name" name="이름" placeholder="성함을 입력해 주세요" required />
      </div>

      <div class="form-group">
        <label for="phone">연락처 <span class="required">*</span></label>
        <input type="tel" id="phone" name="연락처" placeholder="010-0000-0000" required />
      </div>

      <div class="form-group">
        <label for="message">문의내용 <span class="required">*</span></label>
        <textarea id="message" name="문의내용" placeholder="문의하실 내용을 자세히 적어주세요" required></textarea>
      </div>

      <button type="submit" id="submitBtn">신청하기</button>
      <div id="statusMsg" class="status-msg"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById("contactForm");
    const submitBtn = document.getElementById("submitBtn");
    const statusMsg = document.getElementById("statusMsg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      submitBtn.disabled = true;
      submitBtn.textContent = "전송 중...";
      statusMsg.className = "status-msg";
      statusMsg.textContent = "";

      const payload = {
        이름: document.getElementById("name").value.trim(),
        연락처: document.getElementById("phone").value.trim(),
        문의내용: document.getElementById("message").value.trim(),
        _subject: "[신규 문의] 웹사이트에서 신청이 접수되었습니다",
        _template: "table",
        _captcha: "false"
      };

      try {
        const response = await fetch("https://formsubmit.co/ajax/jey0809@bizgrida.co.kr", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (response.ok && (result.success === "true" || result.success === true)) {
          statusMsg.className = "status-msg success";
          statusMsg.textContent = "문의가 정상적으로 접수되었습니다. 확인 후 연락드리겠습니다.";
          form.reset();
        } else if (result.message && result.message.toLowerCase().includes("activation")) {
          statusMsg.className = "status-msg success";
          statusMsg.textContent = "최초 1회 이메일 인증 메일이 발송되었습니다. 받은편지함에서 인증 버튼을 눌러주세요.";
        } else {
          throw new Error("전송 실패");
        }
      } catch (err) {
        statusMsg.className = "status-msg error";
        statusMsg.textContent = "전송 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "신청하기";
      }
    });
  </script>
</body>
</html>
